name: Auto Merge PR to Main

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: 🤖 Auto-Merge PR to Main
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'check_suite' || github.event.check_suite.conclusion == 'success') &&
      (github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main' || github.event.check_suite.pull_requests[0].base.ref == 'main')
    steps:
      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: "automerge,ready to merge"
          MERGE_METHOD: "merge"
          MERGE_COMMIT_MESSAGE: "pull-request-title"
          MERGE_FORKS: "false"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"
